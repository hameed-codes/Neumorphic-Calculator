<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="">
    <div class="calculator">
        <div class="secondary-screen"></div>
        <div class="screen"></div>
        <div class="keypad">
            <!--Row 1-->
            <button class="btn" id="clear">C</button>
            <button class="btn" id="delete"><i class="fa-solid fa-delete-left"></i></button>
            <button class="btn" id="square">X<sup>2</sup></button>
            <button class="btn operator" id="divide">÷</button>
            <!--Row 2-->
            <button class="btn digit" id="seven">7</button>
            <button class="btn digit" id="eight">8</button>
            <button class="btn digit" id="nine">9</button>
            <button class="btn operator" id="multiply">x</button>
            <!--Row 3-->
            <button class="btn digit" id="four">4</button>
            <button class="btn digit" id="five">5</button>
            <button class="btn digit" id="six">6</button>
            <button class="btn operator" id="subtract">-</button>
            <!--Row 4-->
            <button class="btn digit" id="one">1</button>
            <button class="btn digit" id="two">2</button>
            <button class="btn digit" id="three">3</button>
            <button class="btn operator" id="add">+</button>
            <!--Row 5-->
            <button class="btn" id="point">.</button>
            <button class="btn digit" id="zero">0</button>
            <button class="btn" id="equals">=</button> 
            <button class="btn" id="toggle-mode"><i class="fa-solid fa-circle-half-stroke"></i></button>
            
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
